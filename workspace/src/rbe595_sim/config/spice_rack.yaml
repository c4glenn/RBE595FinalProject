# Spice rack layout, shared by models/spice_rack.sdf.xacro and anything that needs slot poses.
# Numbers come from the printed rack's parametric CAD (spice_rack.py, exported to
# meshes/spice_rack.stl): a 2 x 3 rack, 231 x 209 x 24 mm.
#
# Rack frame: origin at the centre of the rack's underside, +x away from the front ledge
# (the gripper closing axis, increasing column index), +y along a row (increasing row index).
# The CAD uses a corner origin instead (front-left-bottom corner at (0, 0, 0)); its slot centres
# are x = 83.5 / 179.5 mm and y = 37.5 / 104.5 / 171.5 mm. In the rack frame, slot (row, col) is
#   x = (col - (cols - 1) / 2) * pitch_x + col_offset
#   y = (row - (rows - 1) / 2) * pitch_y
#   z = floor_thickness            (the floor a bottle stands on)
# col_offset shifts the slot grid off-centre in x, since the front ledge (where the rack tags
# sit) is deeper than the back strip.
#
# Each pocket is a straight bore (cell) with a 45 deg lead-in at the mouth (cell_mouth), so the
# lead-in is (cell_mouth - cell) / 2 = 4 mm deep and the bore below it pocket_depth minus that;
# the jar (models/spice_bottle.sdf.xacro, 48.3 mm) gets ~1.35 mm radial play in the bore and the
# lead-in catches it up to ~5 mm off-centre. Both are in the collision model.
rows: 3
cols: 2
pitch_x: 0.096         # slot centre-to-centre distance along x [m]
pitch_y: 0.067         # slot centre-to-centre distance along y [m]
col_offset: 0.016      # +x shift of the slot grid centre from the rack centre [m]
cell: 0.051            # pocket bore diameter [m]
cell_mouth: 0.059      # pocket diameter at the rim, after the lead-in chamfer [m]
pocket_depth: 0.020    # floor to rim [m]
floor_thickness: 0.004 # material under each pocket [m]
rack_height: 0.024     # overall height, floor_thickness + pocket_depth [m]
len_x: 0.231           # outer size along x [m]
len_y: 0.209           # outer size along y [m]
# The rack's floor collision is a square this wide, centred under the rack, instead of the real
# len_x x len_y. Under gz-physics bullet-featherstone, a bottle standing within ~5 cm of a small,
# thin box's edge never settles: it keeps rocking (up to ~17 deg tilt, ~6 mm lift), and with the
# pocket walls removed it tips over. A floor collision this wide keeps every bottle well inside it
# (measured: < 0.01 deg tilt, no lift; 0.40 m still left one corner bottle rocking ~1 deg, 0.30 m
# more). The visual stays the real rack; the extra collision is a hidden floor_thickness step
# around it, which sim.launch.py also keeps the random bowl off.
floor_collision_size: 0.50
# Rack datum tags: tag36h11 stickers in 0.4 mm recesses in the top face of the front ledge.
# tag_size is the black-border edge (what apriltag_ros calls the tag size); the textured square
# also carries the image's one-cell white border, so it is tag_size * 10 / 8 wide.
tag_size: 0.036
tag_inset_x: 0.023     # tag centre from the front (-x) edge [m]
tag_inset_y: 0.028     # tag centre from the -y / +y edges [m]
rack_tag_top_id: 6     # tag36h11 ID for the +y rack tag (bottles use IDs 0-5)
rack_tag_bottom_id: 7  # tag36h11 ID for the -y rack tag
